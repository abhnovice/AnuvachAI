name: anuvach_mobile
description: Anuvach.AI synthetic incident reporting demonstration.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  firebase_core: ^3.15.2
  firebase_remote_config: ^5.5.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
  assets:
    - assets/fonts/OFL.txt
